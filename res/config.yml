ver: 9
#调试模式: 开启后更新区域会闪烁高亮(白色边框+亮度交替), 方便观察画面分区更新情况
#关闭后闪烁痕迹会自动恢复为真实画面
debug: false

#闲置多久后休眠(示例:10s,1m,5m
IdleSleep: '50s'

#主动为玩家发送地图画面的最大帧数，过大的帧数对宽带要求非常高
UpdateMaxFps: 30

#玩家输入Fps
PlayerInputFps: 20

#单帧发送数据量较大时自动降低帧率(整体降速,不裁剪画面导致撕裂),0为关闭
#注意: smart模式已智能只发送变化区域, 默认不应用此限制
#为1024时宽带占用峰值大约3Mbps ，fps低谷大约为20Fps
#为512时宽带占用峰值大约1Mbps, fps低谷大约10Fps
UpdateMaxSizeLimit: 768

#更新模式: none/scan/chunk/cas/smart
#  none   - 直接发送完整画面
#  scan   - 把所有变化区域包围成一个大矩形发送(浪费带宽)
#  chunk  - 固定网格分块发送
#  cas    - 固定网格内裁剪发送
#  smart  - 智能脏矩形检测(推荐): 自动识别画面变化区域、合并成矩形分块发送、
#           像素级裁剪边缘、大面积变化时自动改发全帧
#  smart支持参数: smart:块大小[:每帧预算字节]
#    例如 smart:8  使用8x8像素块检测(默认)
#  [注意] 默认不对每帧发送字节数做限制, 限制会导致画面撕裂
#  (不推荐) smart:8:2048 会限制每帧最多发送2048字节,超出部分延迟到下一帧
UpdateMode: smart

#显示Fps
ShowFps: false

#启用声音(并不是指客户端，而是服务端播放声音
#正常情况不需要打开这个
#只要客户端和服务端都装了voicechat就能听到声音，不需要启用这个选项
SoundEnable: false

#卡带物品 #默认红砖
CardItem: 'BRICK'

#超出多久没被渲染标记遗忘实例： 示例:30d(30天)
LetheTime: '30d'
#自动关闭被遗弃的实例
LetheClose: false

#创建游戏机收费,需要Vault前置
#当需要允许玩家创建实例时可以设置价格
CreatePrice: 0

#为所有人主动渲染地图画面，会消耗大量带宽。
#开启后围观的玩家帧率不再是PPT
ActivelyRenderEveryone: false

#声音输出音量
AudioOutputVol: 0.3
#声音输出距离
AudioOutputDistance: 0.5

#按键映射
#为空时禁用键位
KeyMapping:
  onSwap: 'B' #交换副手
  onJump: 'A' #跳跃. 唯一一个可映射长按的按键
  onLMB: 'SELECT' #鼠标左键
  onRMB: 'START' # 鼠标右键
  onDrop: '' #丢弃物品,额外的可选键位
